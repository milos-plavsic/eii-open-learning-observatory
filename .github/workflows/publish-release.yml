name: Publish approved release

on:
  workflow_dispatch:
    inputs:
      promotion_run_id:
        description: Successful Promote exact release candidate run ID
        required: true
        type: string
      version:
        description: Exact version without a v prefix
        required: true
        type: string

permissions: {}

jobs:
  publish:
    environment: production-publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Resolve independently approved promotion
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.promotion_run_id }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .name)" = "Promote exact release candidate"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: eii-observatory-${{ inputs.version }}-approved
          path: approved
          run-id: ${{ inputs.promotion_run_id }}
          github-token: ${{ github.token }}
      - name: Enforce independent promotion and publication actors
        env:
          PUBLISHER: ${{ github.actor }}
        run: |
          APPROVER=$(python -c 'import json; print(json.load(open("approved/APPROVAL.json"))["actor"])')
          test -n "$APPROVER"
          test "$APPROVER" != "$PUBLISHER"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Re-verify signed approved bytes
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.EII_RELEASE_PUBLIC_KEY_PEM }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          umask 077
          test -n "$RELEASE_PUBLIC_KEY"
          printf '%s\n' "$RELEASE_PUBLIC_KEY" > /tmp/release-public.pem
          trap 'rm -f /tmp/release-public.pem' EXIT
          python -m pip install approved/eii_observatory-*.whl
          eii release-verify approved --artifacts approved --public-key-file /tmp/release-public.pem
          python -c 'import json,os,pathlib; evidence=json.loads(pathlib.Path("approved/release-evidence.json").read_text()); assert evidence["version"] == os.environ["EXPECTED_VERSION"]'
      - name: Create tag only at final publication boundary
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          REVISION=$(python -c 'import json; print(json.load(open("approved/release-evidence.json"))["revision"])')
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$REVISION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha)" = "$REVISION"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/v$VERSION" -f sha="$REVISION"
          fi
          cat > release-notes.md <<EOF
          EII Open Learning Observatory $VERSION is an independent,
          open-source evidence and quality layer for multilingual digital courses and
          educational AI.

          This release strengthens BabelBridge alignment and glossary-assisted retrieval,
          makes semantic-panel agreement and failure policy explicit, adds versioned
          semantic evidence, and introduces budgeted count privacy plus authenticated,
          crash-recoverable Classroom Weather publication.

          The software has extensive internal verification but has not yet been
          validated against a genuine Petlja export, independently certified, or
          approved for production educational use.

          Initial PLCT interoperability work was informed by Petlja's MIT-licensed
          PLCT Server. Petlja has not reviewed, endorsed, sponsored, or certified this
          release.

          Verified release built and promoted from revision $REVISION.
          EOF
          gh release create "v$VERSION" approved/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --latest \
            --title "EII Open Learning Observatory $VERSION — Public Alpha" \
            --notes-file release-notes.md
