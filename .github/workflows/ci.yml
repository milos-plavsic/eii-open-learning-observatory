name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.12.3"
      - name: Install lockfile-pinned quality environment
        run: uv sync --frozen --extra dev
      - name: Lint and formatting checks
        run: |
          uv run ruff check src tests tools
          uv run ruff format --check src tests tools
      - name: Static type checks
        run: uv run mypy
      - name: Maintainability size ratchet
        run: uv run python tools/maintainability_gate.py
      - name: Branch coverage gate
        run: |
          PYTHONWARNINGS=error PYTHONPATH=src uv run coverage run -m unittest discover -s tests
          uv run coverage report
          uv run coverage json -o /tmp/coverage.json
          uv run python -c 'import json; total=json.load(open("/tmp/coverage.json"))["totals"]; assert total["excluded_lines"] == 33, total'

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Install test and build dependencies
        run: python -m pip install -e . jsonschema==4.25.1 build==1.3.0 setuptools==83.0.0
      - name: Run test suite
        run: PYTHONWARNINGS=error PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate JSON artifacts
        run: |
          python -m json.tool schemas/evidence-bundle.schema.json >/dev/null
          python -m json.tool schemas/semantic-evaluator-policy-1.0.schema.json >/dev/null
          python -m json.tool schemas/semantic-evaluation-record-1.0.schema.json >/dev/null
          python -m json.tool schemas/audit-manifest-2.0.schema.json >/dev/null
          python -m json.tool schemas/audit-authorization-policy-1.0.schema.json >/dev/null
          python -m json.tool schemas/safety-case.schema.json >/dev/null
          python -m json.tool schemas/safety-case-2.0.schema.json >/dev/null
          python -m json.tool schemas/weather-map.schema.json >/dev/null
          python -m json.tool schemas/plct-course-export-v1.schema.json >/dev/null
          python -m json.tool schemas/plct-conformance-report-v1.schema.json >/dev/null
          python -m json.tool schemas/plct-attestation-v1.schema.json >/dev/null
          python -m json.tool schemas/external-validation-record-v1.schema.json >/dev/null
          python -m json.tool schemas/release-evidence-1.0.schema.json >/dev/null
          python -m json.tool schemas/release-manifest-2.0.schema.json >/dev/null
          python tools/build_schema_site.py --check
          PYTHONPATH=src python -m unittest tests.test_schema_conformance -v
      - name: Build and install sdist and wheel
        run: |
          SOURCE_DATE_EPOCH=1700000000 python -m build --sdist --wheel --outdir dist
          python -m pip wheel --no-deps --no-build-isolation dist/*.tar.gz -w dist/from-sdist
          python -m pip install --force-reinstall dist/*.whl
          eii --version
          eii --help >/dev/null

  reproducible-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e . build==1.3.0
      - name: Build identical artifacts twice
        run: |
          SOURCE_DATE_EPOCH=1700000000 python -m build --sdist --wheel --outdir /tmp/build-a
          SOURCE_DATE_EPOCH=1700000000 python -m build --sdist --wheel --outdir /tmp/build-b
          PYTHONPATH=src python -c 'from pathlib import Path; from eii.supply_chain import normalize_sdist_gzip; [normalize_sdist_gzip(p) for d in ("/tmp/build-a","/tmp/build-b") for p in Path(d).glob("*.tar.gz")]'
          cmp /tmp/build-a/eii_observatory-*.whl /tmp/build-b/eii_observatory-*.whl
          cmp /tmp/build-a/eii_observatory-*.tar.gz /tmp/build-b/eii_observatory-*.tar.gz
      - name: Generate and verify checksums and SPDX evidence
        run: |
          VERSION=$(PYTHONPATH=src python -c 'from eii import __version__; print(__version__)')
          PYTHONPATH=src python tools/release_preflight.py --version "$VERSION" /tmp/build-a/*.whl /tmp/build-a/*.tar.gz
          PYTHONPATH=src python -c 'import hashlib,subprocess; from pathlib import Path; from eii import __version__; from eii.supply_chain import build_release_evidence,write_release_evidence,verify_release_evidence; d=Path("/tmp/build-a"); a=tuple(d.glob("*.whl"))+tuple(d.glob("*.tar.gz")); source="sha256:"+hashlib.sha256(subprocess.run(["git","archive","--format=tar","HEAD"],check=True,capture_output=True).stdout).hexdigest(); e=build_release_evidence(a,project="eii-observatory",version=__version__,revision="${{ github.sha }}",source_digest=source,created_at="2023-11-14T22:13:20+00:00"); write_release_evidence(e,Path("/tmp/release-evidence")); verify_release_evidence(Path("/tmp/release-evidence/release-evidence.json"),d)'
          openssl genpkey -algorithm ED25519 -out /tmp/release-private.pem
          openssl pkey -in /tmp/release-private.pem -pubout -out /tmp/release-public.pem
          chmod 600 /tmp/release-private.pem
          PYTHONPATH=src python -c 'from pathlib import Path; from eii.supply_chain import sign_release_evidence,verify_signed_release; e=Path("/tmp/release-evidence"); sign_release_evidence(e,Path("/tmp/release-private.pem"),Path("/tmp/release-public.pem")); verify_signed_release(e,Path("/tmp/build-a"),Path("/tmp/release-public.pem"))'

  deterministic-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.12.3"
      - run: uv sync --frozen
      - name: Run six-language fixture twice
        run: |
          PYTHONPATH=src uv run python -m eii audit examples/cocreate-mini/{en,sr,es,pt,ca,hr} --glossary examples/cocreate-mini/glossary.json --output /tmp/report-a
          PYTHONPATH=src uv run python -m eii audit examples/cocreate-mini/{en,sr,es,pt,ca,hr} --glossary examples/cocreate-mini/glossary.json --output /tmp/report-b
          cmp /tmp/report-a/alignments.json /tmp/report-b/alignments.json
          cmp /tmp/report-a/translation-status.json /tmp/report-b/translation-status.json
          PYTHONPATH=src uv run python -m unittest tests.test_six_language_demo -v

  browser-accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.12.3"
      - run: uv sync --frozen --extra browser
      - run: uv run python -m playwright install --with-deps chromium
      - name: Browser and accessibility smoke
        run: PYTHONPATH=src uv run python tests/browser_smoke.py

  mutation-critical-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.12.3"
      - run: uv sync --frozen
      - name: Mutation-test cryptography, persistence, PLCT, and release evidence
        run: uv run python tests/mutation_probe.py

  security-static-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.12.3"
      - run: uv sync --frozen --extra security --extra supplychain
      - name: Reject medium/high static security findings
        run: uv run bandit -q -ll -r src/eii
      - name: Audit project dependencies
        run: uv run pip-audit .
      - name: Independently validate generated SPDX document
        run: |
          mkdir -p /tmp/spdx-artifacts
          PYTHONPATH=src uv run python - <<'PY'
          import hashlib
          import os
          import subprocess
          import zipfile
          from pathlib import Path
          from eii import __version__
          from eii.supply_chain import build_release_evidence, write_release_evidence
          artifact = Path("/tmp/spdx-artifacts/sample.whl")
          with zipfile.ZipFile(artifact, "w") as archive:
              archive.writestr("sample", "x")
          evidence = build_release_evidence(
              (artifact,), project="eii-observatory", version=__version__,
              revision=os.environ["GITHUB_SHA"],
              source_digest="sha256:" + hashlib.sha256(
                  subprocess.run(["git", "archive", "--format=tar", "HEAD"], check=True, capture_output=True).stdout
              ).hexdigest(),
          )
          write_release_evidence(evidence, Path("/tmp/spdx-evidence"))
          PY
          uv run pyspdxtools -i /tmp/spdx-evidence/sbom.spdx.json

  portable-wheel-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install OpenSSL 3 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Install OpenSSL 3 on Windows
        if: runner.os == 'Windows'
        run: |
          choco install openssl --yes --no-progress
          "C:\Program Files\OpenSSL-Win64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir dist
      - run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',glob.glob('dist/*.whl')[0]])"
      - run: eii --version
      - run: eii --help
      - name: Exercise real Ed25519 operations
        run: |
          python -c "from eii.crypto import openssl_version; print(openssl_version())"
          python -m unittest tests.test_crypto.CryptoTests.test_real_sign_verify_fingerprint_and_tamper

  clean-linux-install:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - run: python -m pip install build==1.3.0
      - run: python -m build --sdist --wheel --outdir /tmp/dist
      - run: python -m pip install /tmp/dist/*.whl
      - run: eii --version
      - run: eii --help
