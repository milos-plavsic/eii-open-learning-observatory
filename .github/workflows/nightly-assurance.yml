name: Nightly assurance

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flakiness-hunter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.12.3"
      - run: uv sync --frozen --extra dev
      - name: Run the full suite twenty times with randomized test order
        env:
          PYTHONWARNINGS: error
          PYTHONPATH: src
        run: |
          for seed in $(seq 1 20); do
            echo "flakiness pass $seed"
            uv run python tools/run_shuffled_tests.py --seed "$seed"
          done

  dependency-and-semgrep-rescan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.12.3"
      - run: uv sync --frozen --extra security
      - run: uv run pip-audit .
      - name: Generic and EII domain-specific Semgrep scan
        run: >-
          docker run --rm -v "$PWD:/src" semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
          semgrep scan --config p/python --config p/security-audit
          --config /src/.semgrep/eii.yml --error --metrics=off /src/src /src/tools
