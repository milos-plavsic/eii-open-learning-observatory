name: Promote exact release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release candidate workflow run ID
        required: true
        type: string
      version:
        description: Exact version without a v prefix
        required: true
        type: string

permissions: {}

jobs:
  promote:
    environment: production-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Resolve and validate candidate run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > candidate-run.json
          conclusion=$(jq -r .conclusion candidate-run.json)
          workflow=$(jq -r .name candidate-run.json)
          branch=$(jq -r .head_branch candidate-run.json)
          revision=$(jq -r .head_sha candidate-run.json)
          test "$conclusion" = success
          test "$workflow" = "Release candidate"
          test "$branch" = main
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: eii-observatory-${{ inputs.version }}-unpublished
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ steps.candidate.outputs.revision }}
          path: source
          persist-credentials: false
      - name: Install and validate exact candidate
        env:
          EXPECTED_REVISION: ${{ steps.candidate.outputs.revision }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install candidate/eii_observatory-*.whl
          python -c 'import hashlib,json,os,pathlib,subprocess; evidence=json.loads(pathlib.Path("candidate/release-evidence.json").read_text()); archive=subprocess.run(["git","archive","--format=tar","HEAD"],cwd="source",check=True,capture_output=True).stdout; digest="sha256:"+hashlib.sha256(archive).hexdigest(); assert evidence["revision"] == os.environ["EXPECTED_REVISION"]; assert evidence["version"] == os.environ["EXPECTED_VERSION"]; assert evidence["source_digest"] == digest; pathlib.Path("source-binding.json").write_text(json.dumps({"revision":evidence["revision"],"version":evidence["version"],"source_digest":digest},sort_keys=True)+"\n")'
          eii --version | grep -Fx "$EXPECTED_VERSION"
      - name: Verify candidate build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          mkdir -p /tmp/provenance-json /tmp/sbom-json
          for artifact in candidate/*.whl candidate/*.tar.gz; do
            name=$(basename "$artifact")
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
              --source-digest "$EXPECTED_REVISION" --source-ref refs/heads/main \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1 --format json \
              > "/tmp/provenance-json/$name.json"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
              --source-digest "$EXPECTED_REVISION" --source-ref refs/heads/main \
              --deny-self-hosted-runners \
              --predicate-type https://spdx.dev/Document/v2.3 --format json \
              > "/tmp/sbom-json/$name.json"
          done
          jq -s 'add' /tmp/provenance-json/*.json > provenance-verification.json
          jq -s 'add' /tmp/sbom-json/*.json > sbom-verification.json
      - name: Record machine-verified promotion approval
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_REVISION: ${{ steps.candidate.outputs.revision }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          PYTHONPATH=source/src python source/tools/release_preflight.py \
            --version "$EXPECTED_VERSION" --repository source --revision "$EXPECTED_REVISION" \
            --approval-output candidate/APPROVAL.json \
            --candidate-run-id "$CANDIDATE_RUN_ID" --approval-run-id "$GITHUB_RUN_ID" \
            --github-repository "$GITHUB_REPOSITORY" --actor "$GITHUB_ACTOR" \
            --environment production-release --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --receipt candidate-workflow-success=candidate-run.json \
            --receipt main-branch-revision-bound=source-binding.json \
            --receipt artifact-version-binding=source-binding.json \
            --receipt artifact-build-provenance=provenance-verification.json \
            --receipt artifact-sbom-attestation=sbom-verification.json \
            candidate/*.whl candidate/*.tar.gz
      - name: Sign and verify candidate manifest
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.EII_RELEASE_PRIVATE_KEY_PEM }}
          RELEASE_PUBLIC_KEY: ${{ vars.EII_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          umask 077
          test -n "$RELEASE_PRIVATE_KEY"
          test -n "$RELEASE_PUBLIC_KEY"
          printf '%s\n' "$RELEASE_PRIVATE_KEY" > /tmp/release-private.pem
          printf '%s\n' "$RELEASE_PUBLIC_KEY" > /tmp/release-public.pem
          trap 'rm -f /tmp/release-private.pem /tmp/release-public.pem' EXIT
          eii release-sign candidate --private-key-file /tmp/release-private.pem --public-key-file /tmp/release-public.pem
          eii release-verify candidate --artifacts candidate --public-key-file /tmp/release-public.pem
      - name: Preserve approved bytes without creating a tag or release
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: eii-observatory-${{ inputs.version }}-approved
          path: candidate/
          if-no-files-found: error
          retention-days: 14
